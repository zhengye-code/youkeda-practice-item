spring.application.name=claw-assistant

server.port=8080
bot.enabled=${BOT_ENABLED:true}

# Message routing: Skill -> RAG -> direct LLM
rag.enabled=${RAG_ENABLED:true}
rag.top-k=${RAG_TOP_K:3}
rag.keywords=${RAG_KEYWORDS:RAG,Skill,Function Calling,知识库,检索增强}

# Learning content generation (module 2)
learning.context.max-turns=${LEARNING_CONTEXT_MAX_TURNS:4}
learning.output.max-tokens=${LEARNING_OUTPUT_MAX_TOKENS:1800}

# Logging
logging.level.root=info
logging.level.com.claw=debug
logging.level.org.springframework=warn
logging.file.name=logs/app.log
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5level){highlight} %clr([%thread]){magenta} %clr(%logger{36}){cyan} - %clr(%msg%n){faint}
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Secrets must come from environment variables. Never commit real keys.
aliyun.dashscope.api-key=${DASHSCOPE_API_KEY:}
aliyun.dashscope.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
aliyun.dashscope.model=${DASHSCOPE_MODEL:qwen3.7-plus}
aliyun.dashscope.tts-model=${DASHSCOPE_TTS_MODEL:cosyvoice-v3-flash}
aliyun.dashscope.tts-voice=${DASHSCOPE_TTS_VOICE:longanrou_v3}
aliyun.dashscope.vl-model=${DASHSCOPE_VL_MODEL:qwen-vl-plus}
aliyun.dashscope.classify-model=${DASHSCOPE_CLASSIFY_MODEL:qwen-turbo}

gaode.weather.api-key=${AMAP_WEATHER_API_KEY:}
gaode.weather.base-url=${AMAP_BASE_URL:https://restapi.amap.com/v3/weather/weatherInfo}
