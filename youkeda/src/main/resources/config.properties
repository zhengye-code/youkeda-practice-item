# ===== 智谱 AI 开放平台配置 =====

# 文本对话接口（chat/completions）
ai.url=https://open.bigmodel.cn/api/paas/v4/chat/completions

# API Key
ai.token=dcde555310bb42eca9b707b6b484153e.6VvHg2MNAUEOiDa1

# 文本模型（经实测：glm-4.7-flashx 在 chat/completions 接口不可用；
# glm-4-flash 免费稳定，glm-4.7 能力更强但默认思考、响应较慢）
ai.model=glm-4-flash

# 连接超时（毫秒）
ai.connectTimeoutMs=15000

# 读取超时（毫秒，大模型处理长上下文可能较慢）
ai.socketTimeoutMs=180000

# 图片视觉识别接口（GLM-4V）
ai.vision.url=https://open.bigmodel.cn/api/paas/v4/chat/completions

# 图片生成接口（CogView 文生图）
ai.imageGen.url=https://open.bigmodel.cn/api/paas/v4/images/generations

# 语音转文本（ASR）
ai.asr.url=https://open.bigmodel.cn/api/paas/v4/audio/transcriptions
ai.asr.model=glm-asr-2512

# 文本转语音（TTS）
ai.tts.url=https://open.bigmodel.cn/api/paas/v4/audio/speech
ai.tts.model=glm-tts
ai.tts.voice=tongtong

# AI 系统提示词前缀（引导 AI 结合对话记录回答，支持 \n 换行）
ai.systemPrompt=你是一个微信聊天AI，具有理解图片、视频、语音、文件的功能。\n我调用了你的API，下面是我们之间的对话记录，你只需要结合对话记录，对用户最新的消息进行回复。\n回复尽量精简且直接地达到用户的要求，并尽量使用大白话。\n如果对话记录中存在你无法直接解析的图片、视频、语音、文件，但可以间接理解，你将直接根据间接理解的信息进行回答。\n对话记录如下：


